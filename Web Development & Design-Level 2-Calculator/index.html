<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/calc.css">
</head>
<body>
   <div class="calculator-card p-4 rounded-4 mt-5 ">
    <h2 class="text-white text-center mb-4 fw-bold">
    <i class="fa-solid fa-calculator me-2"></i>
    Calculator
    </h2>
   <div class="calculator-grid">

    <div class="display item-display bg-dark rounded-3 text-white ps-3"></div>

    <button class="btn bg-danger item-10">C</button>
    <button class="btn bg-danger item-11">DEL</button>
    <button class="btn bg-primary item-12">%</button>
    <button class="btn bg-primary item-13">÷</button>

    <button class="btn bg-dark text-white item-7" >7</button>
    <button class="btn bg-dark text-white item-8">8</button>
    <button class="btn bg-dark text-white item-9">9</button>
    <button class="btn bg-primary item-16">×</button>

    <button class="btn bg-dark text-white item-4">4</button>
    <button class="btn bg-dark text-white item-5">5</button>
    <button class="btn bg-dark text-white item-6">6</button>
    <button class="btn bg-primary item-17">-</button>

    <button class="btn bg-dark text-white item-1">1</button>
    <button class="btn bg-dark text-white item-2">2</button>
    <button class="btn bg-dark text-white item-3">3</button>
    <button class="btn bg-primary item-18">+</button>

    <button class="btn bg-dark text-white item-0">0</button>
    <button class="btn bg-dark text-white item-14">.</button>
    <button class="btn bg-success item-15">=</button>

</div>
</div>
      <script src="js/bootstrap.bundle.js"></script>
      <script src="js/index.js"></script>
</body>
</html>
