<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO LIST</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="bg-warning-subtle">
    <section>
        <div class="container mt-4 bg-white p-4 rounded shadow">
            <div class="container d-flex justify-content-between navb">
                <h1><i class="fa-solid fa-list-check"></i> TO DO LIST</h1>
                <img src="assets/1441035.png" alt="todo" width="100px" height="100px">
            </div>
            <div class="mt-3">
                <form class="d-flex justify-content-around new_Task_Form" id="taskForm">
                    <input type="text" class="form-control" placeholder="Enter a new task" aria-label="Enter a new task"
                        id="taskInput" required>
                    <button type="submit" class="btn btn-primary ms-2" id="addTaskButton">Add Task <i
                            class="fa-solid fa-plus"></i></button>
                </form>
                <div class="row g-4 mt-3">

                    <div class="col-lg-6">
                        <div class="task-section pending-section">

                            <div class="d-flex justify-content-between align-items-center task-header">
                                <h4>
                                    <i class="fa-regular fa-clock"></i> Pending Tasks
                                </h4>

                               <span class="task-count pending-count" id="pendingCount">                                
                                    0 pending
                                </span>
                            </div>

                            <div class="task-list" id="pendingList">
                                <div class="empty-state" id="pendingEmpty">
                                <i class="fa-solid fa-clipboard-list"></i>
                                <h5>No pending tasks!</h5>
                                <p>Add a new task to get started.</p>
                            </div>

                            </div>

                           
                           

                        </div>
                    </div>


                    <div class="col-lg-6">
                        <div class="task-section completed-section">

                            <div class="d-flex justify-content-between align-items-center task-header">
                                <h4>
                                    <i class="fa-solid fa-circle-check"></i>
                                    Completed Tasks
                                </h4>

                                <span class="task-count completed-count" id="completedCount">
                                    0 completed
                                </span>
                            </div>

                            <div class="task-list" id="completedList">
                             <div class="empty-state" id="completedEmpty">
                                <i class="fa-solid fa-trophy"></i>
                                <h5>No completed tasks yet!</h5>
                                
                            </div>
                                

                            </div>

                           

                        </div>
                    </div>

                </div>
            </div>
    </section>
    <script src="Js/bootstrap.bundle.js"></script>
    <script src="Js/index.js"></script>
</body>

</html>
